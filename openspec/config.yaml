schema: spec-driven

context: |
  Tech stack: Next.js 16.2.6 + React 19.2.4 + TypeScript 5 + TailwindCSS 4
  Architecture: Next.js App Router (apps/web/), hexagonal layers (domain, application, infrastructure, shared)
  Testing: Vitest 3.2.6 (root + infrastructure package), 7 unit test files (*.test.ts)
  Style: ESLint 9 (eslint-config-next), TypeScript strict mode, Prettier 3.8.3
  Database: Supabase (migrations + SQL RLS tests)
  CI: GitHub Actions (format:check, lint, typecheck, test, build)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: vitest
  framework: vitest
  layers:
    unit: { available: true, tool: "vitest", command: "pnpm test" }
    integration: { available: false, tool: "—" }
    e2e: { available: false, tool: "—" }
  coverage: { available: false, command: "—" }
  quality:
    linter: { available: true, command: "pnpm lint" }
    type_checker: { available: true, command: "pnpm -r typecheck" }
    formatter: { available: true, command: "pnpm format:check" }
